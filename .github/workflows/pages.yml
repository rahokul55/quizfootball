name: Build and Test Quiz Football V9

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "quizfootball-v9-qa"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply V5 runtime safety patches
        run: timeout 15s node scripts/patch-v5.mjs
      - name: Apply V5 custom match laboratory patches
        run: timeout 15s node scripts/patch-custom-v5.mjs
      - name: Apply V5 multiplayer resilience patches
        run: timeout 15s node scripts/patch-multiplayer-v5.mjs
      - name: Apply V5 social multiplayer patches
        run: timeout 15s node scripts/patch-social-v5.mjs
      - name: Wire V5 UI and offline extras
        run: timeout 15s node scripts/patch-ui-extras-v5.mjs
      - name: Wire V7 chairman production layer
        run: timeout 15s node scripts/patch-v7.mjs
      - name: Wire V8 Turkish audio and match events
        run: timeout 15s node scripts/patch-v8.mjs
      - name: Wire V9 Match Engine and career world
        run: timeout 20s node scripts/patch-v9.mjs

      - name: Resolve player and team images
        run: timeout 180s node scripts/build-images-v4.mjs
      - name: Resolve manager images
        run: timeout 180s node scripts/build-manager-images-v5.mjs

      - name: Persist generated runtime assets
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v5.js chairman-v7.js online-v7.js audio-v8.js match-v9.js career-v9.js v9.css sw-v5.js images-v4.js image-report.json manager-images-v5.js manager-image-report-v5.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh production runtime assets for V9"
            git push
          fi

      - name: Wire localhost legacy QA compatibility
        run: sed -i 's#</body>#  <script src="v6-qa-compat.js"></script>\n</body>#' index.html

      - name: Syntax validation
        run: |
          timeout 10s node --check app-v5.js
          timeout 10s node --check cloud-v5.js
          timeout 10s node --check extras-v5.js
          timeout 10s node --check sw-v5.js
          timeout 10s node --check data-v5.js
          timeout 10s node --check data-v5-plus.js
          timeout 10s node --check data-v5-arcade.js
          timeout 10s node --check data-v5-custom.js
          timeout 10s node --check data-v6.js
          timeout 10s node --check club-v6.js
          timeout 10s node --check data-v7.js
          timeout 10s node --check chairman-v7.js
          timeout 10s node --check online-v7.js
          timeout 10s node --check audio-v8.js
          timeout 10s node --check match-v9.js
          timeout 10s node --check career-v9.js
          timeout 10s node --check v6-qa-compat.js
          timeout 10s node --check scripts/patch-v5.mjs
          timeout 10s node --check scripts/patch-custom-v5.mjs
          timeout 10s node --check scripts/patch-multiplayer-v5.mjs
          timeout 10s node --check scripts/patch-social-v5.mjs
          timeout 10s node --check scripts/patch-ui-extras-v5.mjs
          timeout 10s node --check scripts/patch-v7.mjs
          timeout 10s node --check scripts/patch-v8.mjs
          timeout 10s node --check scripts/patch-v9.mjs
          timeout 10s node --check tests/validate-v5.mjs
          timeout 10s node --check tests/validate-v5-advanced.mjs
          timeout 10s node --check tests/validate-v5-custom.mjs
          timeout 10s node --check tests/validate-v7.mjs
          timeout 10s node --check tests/validate-v8.mjs
          timeout 10s node --check tests/validate-v9.mjs
          timeout 10s node --check tests/e2e-v5.mjs
          timeout 10s node --check tests/e2e-v5-advanced.mjs
          timeout 10s node --check tests/e2e-v5-migration.mjs
          timeout 10s node --check tests/e2e-v5-social.mjs
          timeout 10s node --check tests/e2e-v5-custom.mjs
          timeout 10s node --check tests/e2e-v6.mjs
          timeout 10s node --check tests/e2e-v7.mjs
          timeout 10s node --check tests/e2e-v8.mjs
          timeout 10s node --check tests/e2e-v9.mjs

      - name: V5 base data modes and rules QA
        run: timeout 30s node tests/validate-v5.mjs
      - name: V5 advanced modes QA
        run: timeout 30s node tests/validate-v5-advanced.mjs
      - name: V5 custom match laboratory QA
        run: timeout 30s node tests/validate-v5-custom.mjs
      - name: V7 chairman economy and data QA
        run: timeout 30s node tests/validate-v7.mjs
      - name: V8 Turkish match audio QA
        run: timeout 30s node tests/validate-v8.mjs
      - name: V9 Match Engine career and graphics QA
        run: timeout 30s node tests/validate-v9.mjs

      - name: Install browser QA runtime
        run: npm install --no-save --no-package-lock playwright-core@1.55.0

      - name: V5 two-client solo timed and cloud browser QA
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/qf-v5.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT; sleep 1; timeout 120s node tests/e2e-v5.mjs
      - name: V5 daily race combo and league browser QA
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/qf-v5a.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT; sleep 1; QF_TEST_BASE=http://127.0.0.1:4174/ timeout 120s node tests/e2e-v5-advanced.mjs
      - name: V5 three-client host migration QA
        run: |
          python3 -m http.server 4175 --bind 127.0.0.1 >/tmp/qf-v5m.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT; sleep 1; QF_TEST_BASE=http://127.0.0.1:4175/ timeout 120s node tests/e2e-v5-migration.mjs
      - name: V5 social reactions duplicate-name and spectator QA
        run: |
          python3 -m http.server 4176 --bind 127.0.0.1 >/tmp/qf-v5s.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT; sleep 1; QF_TEST_BASE=http://127.0.0.1:4176/ timeout 120s node tests/e2e-v5-social.mjs
      - name: V5 custom match laboratory browser QA
        run: |
          python3 -m http.server 4177 --bind 127.0.0.1 >/tmp/qf-v5c.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT; sleep 1; QF_TEST_BASE=http://127.0.0.1:4177/ timeout 120s node tests/e2e-v5-custom.mjs
      - name: V6 performance club and live match browser QA
        run: |
          python3 -m http.server 4178 --bind 127.0.0.1 >/tmp/qf-v6.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT; sleep 1; QF_TEST_BASE=http://127.0.0.1:4178/ timeout 120s node tests/e2e-v6.mjs
      - name: V7 chairman career and two-client club duel QA
        run: |
          python3 -m http.server 4179 --bind 127.0.0.1 >/tmp/qf-v7.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT; sleep 1; QF_TEST_BASE=http://127.0.0.1:4179/ timeout 150s node tests/e2e-v7.mjs
      - name: V8 Turkish commentator and SFX browser QA
        run: |
          python3 -m http.server 4180 --bind 127.0.0.1 >/tmp/qf-v8.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT; sleep 1; QF_TEST_BASE=http://127.0.0.1:4180/ timeout 120s node tests/e2e-v8.mjs
      - name: V9 Match Engine 2.0 and career browser QA
        run: |
          python3 -m http.server 4181 --bind 127.0.0.1 >/tmp/qf-v9.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT; sleep 1; QF_TEST_BASE=http://127.0.0.1:4181/ timeout 150s node tests/e2e-v9.mjs

      - name: Verify production files
        run: |
          test -s index.html
          test -s app-v5.js
          test -s data-v6.js
          test -s club-v6.js
          test -s v6.css
          test -s data-v7.js
          test -s chairman-v7.js
          test -s online-v7.js
          test -s chairman-v7.css
          test -s audio-v8.js
          test -s audio-v8.css
          test -s match-v9.js
          test -s career-v9.js
          test -s v9.css
          test -s cloud-v5.js
          test -s sw-v5.js
          test -s images-v4.js
          test -s manager-images-v5.js
          grep -q 'match-v9.js' index.html
          grep -q 'career-v9.js' index.html
          grep -q 'v9.css' index.html
          grep -q 'quizfootball-v9.0.0' sw-v5.js
          grep -q 'QF_MATCH_V9' chairman-v7.js
          grep -q 'QF_MATCH_V9' online-v7.js
          grep -q 'qf:v9-event' audio-v8.js
          echo "V9 production bundle verified: Match Engine 2.0, career office, academy, contracts, scouting, sponsors and advanced football simulation."
