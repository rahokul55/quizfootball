name: Build and Deploy Quiz Football V4

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-v4"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve real football images
        run: timeout 180s node scripts/build-images-v4.mjs

      - name: Persist resolved image manifest
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images-v4.js image-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh resolved football images"
            git push
          fi

      - name: Syntax validation
        run: |
          timeout 10s node --check app.js
          timeout 10s node --check preflight-v4.js
          timeout 10s node --check enhancer-v4.js
          timeout 10s node --check game-core-v4.js
          timeout 10s node --check sw-v4.js

      - name: Game data and rules QA
        run: timeout 25s node tests/validate-v4.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
