name: Build and Deploy Quiz Football V4

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-v4"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Patch live game core
        run: timeout 15s node scripts/patch-app-v4.mjs

      - name: Resolve real football images
        run: timeout 180s node scripts/build-images-v4.mjs

      - name: Persist generated fixes
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js images-v4.js image-report.json enhancements-v4.css
          if ! git diff --cached --quiet; then
            git commit -m "Refresh live core, images and visual fixes"
            git push
          fi

      - name: Syntax validation
        run: |
          timeout 10s node --check app.js
          timeout 10s node --check preflight-v4.js
          timeout 10s node --check enhancer-v4.js
          timeout 10s node --check game-core-v4.js
          timeout 10s node --check sw-v4.js
          timeout 10s node --check tests/e2e-v4.mjs

      - name: Game data and rules QA
        run: timeout 25s node tests/validate-v4.mjs

      - name: Install browser QA runtime
        run: npm install --no-save --no-package-lock playwright-core@1.55.0

      - name: Two-client browser gameplay QA
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/quizfootball-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          timeout 90s node tests/e2e-v4.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
