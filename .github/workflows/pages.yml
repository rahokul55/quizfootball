name: Build and Test Quiz Football V13

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "quizfootball-v13-qa"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wire production layers through V13
        run: |
          timeout 15s node scripts/patch-v5.mjs
          timeout 15s node scripts/patch-custom-v5.mjs
          timeout 15s node scripts/patch-multiplayer-v5.mjs
          timeout 15s node scripts/patch-social-v5.mjs
          timeout 15s node scripts/patch-ui-extras-v5.mjs
          timeout 15s node scripts/patch-v7.mjs
          timeout 15s node scripts/patch-v8.mjs
          timeout 20s node scripts/patch-v9.mjs
          timeout 20s node scripts/patch-v10.mjs
          timeout 20s node scripts/patch-v11.mjs
          timeout 20s node scripts/patch-v13.mjs

      - name: Resolve player and team images
        run: timeout 180s node scripts/build-images-v4.mjs

      - name: Resolve manager images
        run: timeout 180s node scripts/build-manager-images-v5.mjs

      - name: Persist V13 production runtime
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw-v5.js app-v5.js chairman-v7.js online-v7.js match-v9.js career-v9.js images-v4.js image-report.json manager-images-v5.js manager-image-report-v5.json match-flow-v11.js v13.css match3d-v13.js audio-v13.js commentary-v13.js runtime-v13.js scripts/patch-v13.mjs tests/diagnose-v13.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Refresh production runtime assets for V13"
            git pull --rebase origin main
            git push
          fi

      - name: Syntax validation
        run: |
          timeout 10s node --check app-v5.js
          timeout 10s node --check cloud-v5.js
          timeout 10s node --check extras-v5.js
          timeout 10s node --check sw-v5.js
          timeout 10s node --check data-v5.js
          timeout 10s node --check data-v5-plus.js
          timeout 10s node --check data-v5-arcade.js
          timeout 10s node --check data-v5-custom.js
          timeout 10s node --check data-v6.js
          timeout 10s node --check club-v6.js
          timeout 10s node --check data-v7.js
          timeout 10s node --check chairman-v7.js
          timeout 10s node --check online-v7.js
          timeout 10s node --check audio-v8.js
          timeout 10s node --check match-v9.js
          timeout 10s node --check career-v9.js
          timeout 10s node --check match3d-v10.js
          timeout 10s node --check match-details-v10.js
          timeout 10s node --check commentary-v10.js
          timeout 10s node --check match-flow-v11.js
          timeout 10s node --check match3d-v11.js
          timeout 10s node --check match3d-v13.js
          timeout 10s node --check audio-v13.js
          timeout 10s node --check commentary-v13.js
          timeout 10s node --check runtime-v13.js
          timeout 10s node --check scripts/patch-v13.mjs
          timeout 10s node --check tests/diagnose-v13.mjs

      - name: Static data and engine QA
        run: |
          timeout 30s node tests/validate-v5.mjs
          timeout 30s node tests/validate-v5-advanced.mjs
          timeout 30s node tests/validate-v5-custom.mjs
          timeout 30s node tests/validate-v7.mjs
          timeout 30s node tests/validate-v8.mjs
          timeout 30s node tests/validate-v9.mjs

      - name: Install browser QA runtime
        run: npm install --no-save --no-package-lock playwright-core@1.55.0

      - name: V5 multiplayer regression browser QA
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/qf-v5.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT; sleep 1; timeout 120s node tests/e2e-v5.mjs

      - name: V5 host migration browser QA
        run: |
          python3 -m http.server 4175 --bind 127.0.0.1 >/tmp/qf-v5m.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT; sleep 1; QF_TEST_BASE=http://127.0.0.1:4175/ timeout 120s node tests/e2e-v5-migration.mjs

      - name: V7 chairman career browser QA
        run: |
          python3 -m http.server 4179 --bind 127.0.0.1 >/tmp/qf-v7.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT; sleep 1; QF_TEST_BASE=http://127.0.0.1:4179/ timeout 150s node tests/e2e-v7.mjs

      - name: V13 authoritative 3D and commentator browser QA
        run: |
          python3 -m http.server 4185 --bind 127.0.0.1 >/tmp/qf-v13.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT; sleep 1; QF_TEST_BASE=http://127.0.0.1:4185/ timeout 170s node tests/diagnose-v13.mjs

      - name: Verify V13 production bundle
        run: |
          test -s index.html
          test -s sw-v5.js
          test -s match-flow-v11.js
          test -s match3d-v13.js
          test -s audio-v13.js
          test -s commentary-v13.js
          test -s runtime-v13.js
          test -s v13.css
          grep -q 'Quiz Football V13' index.html
          grep -q 'v13.css?v=1300' index.html
          grep -q 'audio-v13.js?v=1300' index.html
          grep -q 'match3d-v13.js?v=1300' index.html
          grep -q 'commentary-v13.js?v=1300' index.html
          grep -q 'runtime-v13.js?v=1300' index.html
          ! grep -q 'match3d-v10.js?v=1000' index.html
          ! grep -q 'match3d-v11.js?v=1100' index.html
          ! grep -q 'runtime-v12.js?v=1200' index.html
          ! grep -q 'commentary-v10.js?v=1100' index.html
          ! grep -q 'audio-v8.js?v=800' index.html
          grep -q "quizfootball-v13.0.0" sw-v5.js
          grep -q 'QF_MATCH_3D_V13' match3d-v13.js
          grep -q 'QF_COMMENTARY_V13' commentary-v13.js
          echo "V13 production bundle verified: single instanced WebGL2 match renderer, adaptive in-3D LOD, readable paginated UI and one paced commentator control surface."
